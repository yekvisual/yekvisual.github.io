# Taranan kaynaklar. Her kaynak: ad, tur (rss | github | huggingface | arxiv | reddit),
# url ya da tür'e özel alanlar, varsayılan kategori ve isteğe bağlı anahtar kelime filtresi.
# `python -m collector --check` her kaynağın çalışıp çalışmadığını listeler.
#
# RSS vermeyen şirketler `sayfa` türüyle izlenir (haber sayfasındaki yazı bağlantıları).
# Okunamayanlar (dışarıdan erişimi engelliyor): Ideogram, Adobe — The Verge/TechCrunch üzerinden gelir.
#
# kategori değerleri site/src/lib/taxonomy.ts ile aynı:
#   gorsel, video, ses, 3d, araclar, acik-kaynak, otomasyon, arastirma

rss:
  # Haber siteleri ve bültenler (28 Ekim 2026, kullanıcı onayıyla)
  - ad: The Rundown AI
    url: https://www.therundown.ai/feed
    kategori: araclar
  - ad: TLDR AI
    url: https://tldr.tech/api/rss/ai
    kategori: araclar
  - ad: The Verge AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    kategori: araclar
    anahtar: [image, video, music, audio, voice, model, gemini, veo, sora, midjourney, runway, kling, flux, adobe, firefly, claude, open source, open-source]
  - ad: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    kategori: araclar
    anahtar: [image, video, music, audio, voice, model, launch, releases, open source, open-source, generative]
  - ad: Midjourney
    url: https://updates.midjourney.com/rss/
    kategori: gorsel
  - ad: OpenAI
    url: https://openai.com/news/rss.xml
    kategori: araclar
  - ad: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    kategori: gorsel
  - ad: Google Blog
    url: https://blog.google/rss/
    kategori: araclar
    anahtar: [gemini, veo, imagen, nano banana, image, video, flow, whisk, ai]
  - ad: ElevenLabs
    url: https://elevenlabs.io/blog/rss.xml
    kategori: ses
  - ad: NVIDIA Blog
    url: https://blogs.nvidia.com/feed/
    kategori: arastirma
    anahtar: [generative, diffusion, video, image, nim, omniverse, 3d]
  - ad: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    kategori: acik-kaynak
  - ad: Remotion
    url: https://www.remotion.dev/blog/rss.xml
    kategori: video
  - ad: Blackmagic Design
    url: https://www.blackmagicdesign.com/rss
    kategori: video
    anahtar: [resolve, ai, neural]
  - ad: Comfy Blog
    url: https://blog.comfy.org/feed
    kategori: acik-kaynak
  - ad: Replicate
    url: https://replicate.com/blog/rss
    kategori: acik-kaynak
  - ad: fal.ai
    url: https://blog.fal.ai/rss/
    kategori: araclar

github:
  - ad: ComfyUI
    repo: comfyanonymous/ComfyUI
    kategori: acik-kaynak
  - ad: diffusers
    repo: huggingface/diffusers
    kategori: acik-kaynak
  - ad: Remotion
    repo: remotion-dev/remotion
    kategori: video
  - ad: HyperFrames
    repo: hyperframes/hyperframes
    kategori: video
  - ad: Wan
    repo: Wan-Video/Wan2.2
    kategori: acik-kaynak
  - ad: Claude Code
    repo: anthropics/claude-code
    kategori: otomasyon

huggingface:
  - ad: HF görsel
    filtre: text-to-image
    kategori: gorsel
  - ad: HF video
    filtre: text-to-video
    kategori: video
  - ad: HF görselden video
    filtre: image-to-video
    kategori: video
  - ad: HF ses
    filtre: text-to-speech
    kategori: ses
  - ad: HF 3D
    filtre: image-to-3d
    kategori: 3d

arxiv:
  - ad: arXiv görsel/video üretimi
    sorgu: "(cat:cs.CV OR cat:cs.GR) AND (abs:\"video generation\" OR abs:\"image generation\" OR abs:\"text-to-image\" OR abs:\"text-to-video\" OR abs:\"image editing\" OR abs:\"diffusion model\")"
    kategori: arastirma
    limit: 25

reddit:
  - ad: r/StableDiffusion
    sub: StableDiffusion
    kategori: acik-kaynak
    limit: 8
  - ad: r/aivideo
    sub: aivideo
    kategori: video
    limit: 8
  - ad: r/midjourney
    sub: midjourney
    kategori: gorsel
    limit: 8
  - ad: r/ClaudeAI
    sub: ClaudeAI
    kategori: otomasyon
    limit: 8

# Şirket haber sayfaları (RSS yok). dom: true → başsız Chrome ile okunur.
sayfa:
  - ad: Anthropic
    url: https://www.anthropic.com/news
    kategori: araclar
    desen: /news/[a-z0-9-]{8,}
  - ad: Meta AI
    url: https://ai.meta.com/blog/
    kategori: arastirma
    dom: true
    desen: /blog/[a-z0-9-]{8,}
  - ad: Black Forest Labs
    url: https://bfl.ai/blog
    kategori: gorsel
    desen: /blog/[a-z0-9-]{6,}
  - ad: Runway
    url: https://runwayml.com/news
    kategori: video
    desen: /(news|research)/[a-z0-9-]{8,}
  - ad: Luma
    url: https://lumalabs.ai/news
    kategori: video
    dom: true
    desen: /(news|blog)/[a-z0-9-]{8,}
  - ad: Kling AI
    url: https://klingai.com/global/
    kategori: video
    dom: true
    desen: /(blog|news|release|notice)
  - ad: Suno
    url: https://suno.com/blog
    kategori: ses
    dom: true
    desen: /blog/[a-z0-9-]{6,}
  - ad: Udio
    url: https://www.udio.com/blog
    kategori: ses
    dom: true
    desen: /blog/[a-z0-9-]{6,}

