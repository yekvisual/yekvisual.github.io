ad: Görsel
sira: 1
olcu: "Sıra YEK Lab seçimi; puan Artificial Analysis Image Arena, metinden görsel (kör oylama Elo)"
yeklab_sirasi: true
kaynak: "Artificial Analysis Text-to-Image Leaderboard (AA-Image-T2I v2.1), 23 Kasım 2026'da okundu"
guncelleme: 2026-11-23
aciklama: "Metinden görsel üreten modeller. Daha çok seçenek göstermek için her firmadan yalnız en yüksek puanlı modeli aldık. OpenAI'ın en güncel modeli başta; Kling Image 4.0 ve Canva Craft'ı ardından koyduk. Gerisi Artificial Analysis'in kör oylama puanına göre."
yontem: "Kullanıcılar aynı istemle üretilmiş iki görseli adını görmeden karşılaştırıyor; oylardan Elo puanı çıkıyor. FLUX.2 [dev] bu ölçekte 1000 puanlık çapa model. Her firmadan yalnız en yüksek puanlı modeli gösteriyoruz; örneğin arenanın ilk altı sırasından beşi OpenAI'ın GPT Image sürümleri, burada yalnız en yükseği var. Fiyat görsel başına API fiyatı; puana karışmaz."
degisenler:
  - { metin: "Microsoft'un MAI-Image-2.7'si 1215 puanla girdi; denedik", yon: yeni }
  - { metin: "Her firmadan tek model: Muse Image, FLUX 3 ve Qwen listeye girdi", yon: yeni }
  - { metin: "GPT Image 2.6 Sunburst birinciliği korudu (1263)", yon: yukari }
modeller:
  - { ad: "GPT Image 2.6 Sunburst", firma: OpenAI, puan: 1263, erisim: ucretli, fiyat: "$0,21", not: "Arenanın ilk altı sırasından beşi OpenAI'ın; en günceli ve en yükseği bu." }
  - { ad: "Kling Image 4.0", firma: Kuaishou, puan: 1181, erisim: deneme, fiyat: "$0,063" }
  - { ad: "Canva Craft", firma: Canva, puan: 1157, erisim: sinirli, fiyat: "$0,03", not: "Canva'da Dream Lab bölümünden, ücretsiz hesapla da kullanılabiliyor." }
  - { ad: "MAI-Image-2.7", firma: Microsoft AI, puan: 1215, erisim: sinirli, fiyat: "$0,035", not: "Denedik: Türkçe başlık ve kısa yazıları doğru yazdı, yalnız ekran içindeki küçük yazılarda harf hatası var. MAI Labs'te Microsoft hesabıyla ücretsiz denenebiliyor." }
  - { ad: "Nano Banana 2.1", firma: Google, puan: 1175, erisim: sinirli, turkce: evet, fiyat: "$0,034", not: "Gemini uygulamasında ücretsiz." }
  - { ad: "Grok Imagine Image 2.0", firma: xAI, puan: 1167, erisim: ucretli, fiyat: "$0,06" }
  - { ad: "Seedream 5.5", firma: ByteDance, puan: 1135, erisim: ucretli, fiyat: "$0,02", not: "Şeffaf arka planlı görseli doğrudan üretiyor; 100 tura kadar düzenleme." }
  - { ad: "Muse Image", firma: Meta, puan: 1126, erisim: sinirli, fiyat: "$0,01", not: "Meta AI uygulamasında ve meta.ai'da." }
  - { ad: "FLUX 3 Image", firma: Black Forest Labs, puan: 1114, erisim: ucretli, fiyat: "$0,048" }
  - { ad: "Qwen-Image-3.0-Pro", firma: Alibaba, puan: 1094, erisim: ucretli, fiyat: "$0,04" }
gecmis:
  - { tarih: 2026-11-02, puanlar: { "GPT Image 2.5 Sunburst": 1222, "GPT Image 2.5 Flare": 1207, "GPT Image 2": 1186, "Nano Banana 2.1": 1176, "MAI-Image-2.6": 1166 } }
  - { tarih: 2026-11-17, puanlar: { "GPT Image 2.6 Sunburst": 1261, "Kling Image 4.0": 1180, "Nano Banana 2.1": 1176, "MAI-Image-2.6": 1168, "Grok Imagine Image 2.0": 1167 } }
  - { tarih: 2026-11-23, puanlar: { "GPT Image 2.6 Sunburst": 1263, "MAI-Image-2.7": 1215, "Kling Image 4.0": 1181, "Nano Banana 2.1": 1175, "MAI-Image-2.6": 1168 } }
