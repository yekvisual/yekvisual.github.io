ad: Görsel
sira: 1
olcu: "Artificial Analysis Image Arena, metinden görsel (kör oylama Elo puanı)"
kaynak: "Artificial Analysis Text-to-Image Leaderboard, 2 Kasım 2026'da okundu"
guncelleme: 2026-11-02
aciklama: "Metinden görsel üreten modeller, kör oylamayla sıralanıyor. Puanlar Artificial Analysis'ten aynen alındı."
yontem: "Kullanıcılar aynı istemle üretilmiş iki görseli adını görmeden karşılaştırıyor; oylardan Elo puanı çıkıyor. FLUX.2 [dev] bu ölçekte 1000 puanlık çapa model. Fiyat görsel başına API fiyatı; puana karışmaz. LMArena'da da ilk sırada aynı model var (GPT Image 2.5 Sunburst)."
degisenler:
  - { metin: "İlk gerçek ölçüm: puanlar artık tamamen kamu verisi", yon: yeni }
  - { metin: "OpenAI GPT Image 2.5 iki arenada da birinci", yon: yukari }
  - { metin: "En iyi açık model FLUX 3 Image Klein, 21. sırada", yon: asagi }
