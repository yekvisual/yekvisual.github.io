olcu: "Sıra YEK Lab seçimi; puan Artificial Analysis Music Arena, vokalli parça (kör oylama Elo)"
yeklab_sirasi: true
kaynak: "Artificial Analysis Music Leaderboard (vokal), 17 Kasım 2026'da okundu"
guncelleme: 2026-11-17
aciklama: "Sözlü şarkı üreten modeller. Suno v6'yı deneyimimize göre birinci sırada tuttuk; ACE Music v1 puanda önde. Gerisi Artificial Analysis'in kör dinleme puanına göre."
yontem: "Dinleyiciler aynı tarifle üretilmiş iki parçayı adını bilmeden karşılaştırıyor; oylardan Elo puanı çıkıyor. MiniMax Music 3.0 bu ölçekte 1000 puanlık çapa model. Birinci sıra bizim seçimimiz: Suno v6 her gün ücretsiz krediyle denenebiliyor ve sonuçlarını daha çok tanıyoruz."
