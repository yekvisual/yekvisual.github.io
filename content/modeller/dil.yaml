ad: Dil
sira: 3
olcu: "Sıra YEK Lab seçimi; puan Artificial Analysis Intelligence Index v5 (her modelin en yüksek ayarı)"
yeklab_sirasi: true
kaynak: "Artificial Analysis LLM Leaderboard, 17 Kasım 2026'da okundu"
guncelleme: 2026-11-17
aciklama: "Yazı, kod ve ajan görevlerinde dil modelleri. Fable 5.2 endekste de birinci. Opus 5.5'i, gerçek işlerdeki deneyimimize göre Gemini 4 Carbon'un önüne koyduk. Gerisi Artificial Analysis'in zekâ endeksine göre."
yontem: "İlk üç sıra bizim seçimimiz: Fable 5.2 ve Opus 5.5'i içerik ve kod işlerinde kullanıyoruz; Gemini 4 Carbon puanda Opus'un önünde ama denemelerimizde sık hata verdi. Intelligence Index; bilgi, akıl yürütme, kod ve ajan görevlerindeki bağımsız testlerin ortalaması. Aynı model farklı düşünme ayarlarıyla birden çok kez ölçülüyor; burada her modelin en yüksek puanlı ayarı var. Fiyat, milyon token başına giriş / çıkış."
degisenler:
  - { metin: "Claude Fable 5.2 endekste 64,6 ile birinci", yon: yeni }
  - { metin: "Gemini 4 Hydrogen ilk 10'da; ücretsiz hesapta otomatik seçimle", yon: yeni }
  - { metin: "Fable 5.1 endeksten kalktı; Qwen4 Max listeye girdi", yon: asagi }
modeller:
  - { ad: "Claude Fable 5.2", firma: Anthropic, puan: 64.6, erisim: ucretli, fiyat: "$8 / $40 (M token)", not: "Endekste açık ara birinci. Kodla animasyon ve uzun işlerde güçlü; 12 Kasım'da Opus 5.5 ile aynı istemlerle denedik." }
  - { ad: "Claude Opus 5.5", firma: Anthropic, puan: 59.1, erisim: ucretli, fiyat: "$4 / $20 (M token)", not: "Bence içerik ve uzun yazı için hâlâ en güvenilir model. Uzun metin yazımında (EQ-Bench) 3., LiveBench'te 3." }
  - { ad: "Gemini 4 Carbon", firma: Google, puan: 60.0, erisim: ucretli, fiyat: "$2 / $10 (M token, 30 Kasım'a kadar; sonra $4 / $20)", not: "Puanda Opus'un önünde ama bizim denemelerimizde sık hata verdi, bu yüzden üçüncü sırada. Gemini uygulamasında yalnız AI Ultra abonelerine, API'de ücretli geliştiricilere açık." }
