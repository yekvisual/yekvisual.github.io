ad: Video
sira: 2
olcu: "Sıra YEK Lab seçimi; puan Artificial Analysis Video Arena, görselden sesli video (kör oylama Elo)"
yeklab_sirasi: true
kaynak: "Artificial Analysis Image-to-Video Leaderboard (Ekim 2026 yenilemesi), 2 Kasım 2026'da okundu"
guncelleme: 2026-11-02
aciklama: "Görselden sesli video üreten modeller: bir kare verip onu canlandırıyorsunuz. Gerçek işlerde en çok bu yol kullanılıyor. Seedance ölçümde de birinci; Kling 4.0'ı deneyimimize göre ikinci sıraya koyduk. Gerisi Artificial Analysis'in kör oylama puanına göre."
yontem: "Metinden video yerine görselden videoyu esas aldık: kareyi siz belirlediğiniz için sonuç daha gerçekçi ve kontrol edilebilir oluyor. Artificial Analysis kullanıcılara aynı görselden üretilmiş iki videoyu adını göstermeden izletiyor; oylardan Elo puanı çıkıyor. Kling 3.0 bu ölçekte 1000 puanlık çapa model. Herkese açık API'si olmayan Utopai X listeye alınmadı. Fiyat dakika başına API fiyatı; puana karışmaz."
degisenler:
  - { metin: "Tablo artık görselden video sıralamasına göre", yon: yeni }
  - { metin: "Seedance 2.5 görselden videoda birinci", yon: yukari }
  - { metin: "Kling 4.0 Design Arena'da görselden videoda ikinci", yon: yeni }
modeller:
  - { ad: "Seedance 2.5", firma: ByteDance, puan: 1153, erisim: ucretli, fiyat: "$34,12 / dk", not: "Bence şu an en iyi video modeli; ölçümde de birinci." }
  - { ad: "Kling 4.0", firma: Kuaishou, puan: null, erisim: deneme, fiyat: "Deneme kredisi, sonra abonelik", not: "Artificial Analysis'te henüz yok, puanı yok. Design Arena'da görselden videoda 2. Tek çekimde 30 saniye, karakter tutarlılığı güçlü." }
  - { ad: "Seedance 2.0", firma: ByteDance, puan: 1136, erisim: ucretli, fiyat: "$22,45 / dk" }
  - { ad: "MiniMax H3 (768p)", firma: MiniMax, puan: 1128, erisim: acik, fiyat: "$4,80 / dk", not: "İlk 10'daki tek açık ağırlıklı model." }
  - { ad: "Hyperflow H3", firma: Video Rebirth, puan: 1124, erisim: ucretli, fiyat: "$9 / dk" }
  - { ad: "HeyGen Video 1", firma: HeyGen, puan: 1120, erisim: ucretli, fiyat: "$2,40 / dk" }
  - { ad: "P-Video-2-Pro", firma: Pruna AI, puan: 1119, erisim: ucretli, fiyat: "$5,70 / dk" }
  - { ad: "MiniMax H3 Max", firma: Fal, puan: 1117, erisim: ucretli, fiyat: "$9,60 / dk" }
  - { ad: "Wan 3.0", firma: Alibaba, puan: 1111, erisim: ucretli, fiyat: "$12 / dk" }
  - { ad: "Agnes-Video-2.5", firma: Sapiens AI, puan: 1100, erisim: ucretli, fiyat: "$2,40 / dk" }
gecmis:
