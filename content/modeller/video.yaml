ad: Video
sira: 2
olcu: "Sıra YEK Lab seçimi; puan Artificial Analysis Video Arena, metinden sesli video (kör oylama Elo)"
yeklab_sirasi: true
kaynak: "Artificial Analysis Text-to-Video Leaderboard (Eylül 2026 yenilemesi), 2 Kasım 2026'da okundu"
guncelleme: 2026-11-02
aciklama: "İlk iki sıra bizim seçimimiz: kendi işlerimizde en çok güvendiğimiz modeller. Gerisi Artificial Analysis'in kör oylama puanına göre; puanlar aynen alındı."
yontem: "Artificial Analysis kullanıcılara aynı istemle üretilmiş iki videoyu adını göstermeden izletip hangisinin daha iyi olduğunu soruyor; oylardan satranç benzeri bir Elo puanı çıkıyor. Kling 3.0 bu ölçekte 1000 puanlık çapa model. Seedance ve Kling'i deneyimimize göre öne aldık; puanları değiştirmedik. Fiyat, Artificial Analysis'in API fiyatı (dakika başına); puana karışmaz."
degisenler:
  - { metin: "İlk gerçek ölçüm: puanlar artık tamamen kamu verisi", yon: yeni }
  - { metin: "Seedance 2.5 görselden video sıralamasında birinci", yon: yukari }
  - { metin: "Kling 4.0 arenalarda henüz yok; bizim listemizde ikinci", yon: yeni }
modeller:
  - { ad: "Seedance 2.5", firma: ByteDance, puan: 1157, erisim: ucretli, fiyat: "$34,12 / dk", not: "Bence şu an en iyi video modeli; görselden video sıralamasında da birinci." }
  - { ad: "Kling 4.0", firma: Kuaishou, puan: null, erisim: deneme, fiyat: "Deneme kredisi, sonra abonelik", not: "Arenalara henüz girmedi, puanı yok. Tek çekimde 30 saniye, karakter tutarlılığı güçlü." }
  - { ad: "Wan 3.0", firma: Alibaba, puan: 1175, erisim: ucretli, fiyat: "$12 / dk" }
