name: Haberleri topla

# Günde 3 kez kaynakları tarar, Claude ile eler ve Türkçe yazar.
# Puanı yüksek haberler main'e commit edilir (site otomatik yayınlanır),
# kararsız olanlar "Onay bekleyenler" PR'ı olarak açılır; merge = yayın.
on:
  schedule:
    - cron: "0 5,11,17 * * *" # 08:00, 14:00, 20:00 Türkiye
  workflow_dispatch:
    inputs:
      mode:
        description: "calistir = topla ve yaz, deneme = yazmadan göster, kontrol = kaynak sağlığı"
        type: choice
        options: [calistir, deneme, kontrol]
        default: calistir
      since:
        description: "Kaç günlük öğe taransın"
        default: "2"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Toplayıcıyı çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEME_MODEL: ${{ vars.ELEME_MODEL }}
          YAZIM_MODEL: ${{ vars.YAZIM_MODEL }}
          MAKS_OGE: ${{ vars.MAKS_OGE || '60' }}
          MODE: ${{ inputs.mode || 'calistir' }}
          SINCE: ${{ inputs.since || '2' }}
        run: |
          case "$MODE" in
            kontrol) python -m collector --check --since "$SINCE" ;;
            deneme)  python -m collector --dry-run --since "$SINCE" ;;
            *)       python -m collector --since "$SINCE" ;;
          esac

      - name: Yayınla ve onaya gönder
        if: (inputs.mode || 'calistir') == 'calistir'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "yekvisual-bot"
          git config user.email "yekvisual-bot@users.noreply.github.com"
          [ -f data/son_calistirma.json ] || { echo "manifest yok"; exit 0; }
          yayin=$(jq -r '.yayin[]' data/son_calistirma.json)
          onay=$(jq -r '.onay[]' data/son_calistirma.json)

          # 1) Doğrudan yayın: haber dosyaları + medya klasörleri + seen.json
          git add data/seen.json data/son_calistirma.json
          for f in $yayin; do git add "$f"; [ -d "${f%.md}" ] && git add "${f%.md}"; done
          if ! git diff --cached --quiet; then
            n=$(echo "$yayin" | grep -c . || true)
            git commit -m "Haberler: $n yeni yayın [bot]"
            git push
            gh workflow run deploy.yml --ref main || true
          fi

          # 2) Onay bekleyenler: ayrı dal + PR
          if [ -n "$onay" ]; then
            dal="onay/$(date -u +%Y-%m-%d-%H%M)"
            git checkout -b "$dal"
            for f in $onay; do git add "$f"; [ -d "${f%.md}" ] && git add "${f%.md}"; done
            n=$(echo "$onay" | grep -c . || true)
            git commit -m "Onay bekleyen $n haber [bot]"
            git push -u origin "$dal"
            govde=$(printf '%s\n' "Bot bu haberleri kararsız puanladı. Beğendiklerini düzenleyip merge et, istemediklerini PR'ı kapatarak reddet (dosyayı silmen yeterli)." "" "$(echo "$onay" | sed 's/^/- /')" "" "Düzeltmelerin merge sonrası üslup rehberine işlenir.")
            gh pr create --title "Onay bekleyenler · $(date -u +%d.%m.%Y)" --body "$govde" --label onay || gh pr create --title "Onay bekleyenler · $(date -u +%d.%m.%Y)" --body "$govde"
          fi
