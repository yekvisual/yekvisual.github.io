name: Haftalık özet

# Her pazar haftanın haberlerinden bir özet yazısı üretir ve (ayarlıysa) bülten gönderir.
on:
  schedule:
    - cron: "0 7 * * 0" # Pazar 10:00 Türkiye
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Özeti yaz
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YAZIM_MODEL: ${{ vars.YAZIM_MODEL }}
          NEWSLETTER_API_KEY: ${{ secrets.NEWSLETTER_API_KEY }}
        run: python -m collector.weekly
      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "yekvisual-bot"
          git config user.email "yekvisual-bot@users.noreply.github.com"
          git add content/ozetler
          if ! git diff --cached --quiet; then
            git commit -m "Haftalık özet [bot]"
            git push
            gh workflow run deploy.yml --ref main || true
          fi
