name: Üslup öğren

# Bir "onay/*" PR'ı merge edildiğinde, botun yazdığı metinle senin düzelttiğin metin
# arasındaki farktan üslup kuralları çıkarır ve style/uslup.md'ye ekler.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  learn:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'onay/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Farkı analiz et
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YAZIM_MODEL: ${{ vars.YAZIM_MODEL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m collector.style_learn
      - name: Commit
        run: |
          git config user.name "yekvisual-bot"
          git config user.email "yekvisual-bot@users.noreply.github.com"
          git add style/uslup.md
          if ! git diff --cached --quiet; then
            git commit -m "Üslup rehberi güncellendi [bot]"
            git push
          fi
